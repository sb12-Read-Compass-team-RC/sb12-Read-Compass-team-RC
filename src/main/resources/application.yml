spring:
  application:
    name: read-compass
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    multipart:
      max-file-size: 100MB
      max-request-size: 300MB
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  # ──────────────────────────────────────────────
  # 시크릿 — 로컬: .env / 운영: ECS 태스크 정의(SSM ValueFrom)
  # 기본값을 두지 않아 미설정 시 기동 단계에서 즉시 실패(fail-fast)한다.
  # ──────────────────────────────────────────────
  jwt:
    secret: ${JWT_SECRET}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email
            client-name: Naver

        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

  # JPA
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        jdbc.time_zone: UTC
    open-in-view: false

# 외부 API 키 — 로컬: .env / 운영: ECS 태스크 정의
naver:
  book:
    client-id: ${NAVER_BOOK_CLIENT_ID}
    client-secret: ${NAVER_BOOK_CLIENT_SECRET}
    base-url: https://openapi.naver.com

ocr:
  space:
    api-key: ${OCR_SPACE_API_KEY}
    url: https://api.ocr.space/parse/image

# log
logging:
  level:
    root: info
    org.hibernate.SQL: off
    org.hibernate.orm.jdbc.bind: off
    org.springframework.web: info
  pattern:
    console: "%d{HH:mm:ss} %-5level %logger{36} - %msg%n"

read-compass:
  storage:
    local:
      root-path: .read-compass/storage

app:
  jwt:
    access-expire-ms: ${ACCESS_EXPIRE_MS:600000}      # 기본 10분
    refresh-expire-ms: ${REFRESH_EXPIRE_MS:86400000}  # 기본 1일
  cookie:
    refresh-max-age: ${REFRESH_MAX_AGE:86400}          # 기본 1일(초)