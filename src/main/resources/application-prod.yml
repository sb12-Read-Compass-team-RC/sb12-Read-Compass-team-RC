spring:
  config:
    activate:
      on-profile: prod
    import: optional:dotenv:.

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jwt:
    secret: ${JWT_SECRET}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email
            client-name: Naver

        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

server:
  port: 8080
  # ALB 가 HTTPS 를 종단(terminate)하고 컨테이너에는 HTTP 로 전달하므로,
  # X-Forwarded-Proto/Host 헤더를 반영해야 OAuth redirect 의 {baseUrl} 과
  # secure 쿠키가 https 기준으로 올바르게 동작한다.
  forward-headers-strategy: framework

# 외부 API 키 (ECS 환경변수 주입)
naver:
  book:
    client-id: ${NAVER_BOOK_CLIENT_ID}
    client-secret: ${NAVER_BOOK_CLIENT_SECRET}
    base-url: https://openapi.naver.com

ocr:
  space:
    api-key: ${OCR_SPACE_API_KEY}
    url: https://api.ocr.space/parse/image

file:
  upload-dir: ${FILE_UPLOAD_DIR:/app/uploads}

storage:
  type: ${STORAGE_TYPE:local}
  local:
    root-path: ${STORAGE_LOCAL_ROOT_PATH:/app/uploads}

aws:
  access-key: ${AWS_S3_ACCESS_KEY}
  secret-key: ${AWS_S3_SECRET_KEY}
  region: ${AWS_S3_REGION}
  s3:
    bucket: ${AWS_S3_BUCKET}
    presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:600}

logging:
  level:
    com.rc.readcompass: info
    org.hibernate.SQL: off
    org.hibernate.orm.jdbc.bind: off
    org.springframework.web: info

app:
  frontend:
    auth-success-url: ${SUCCESS_REDIRECT_URL:http://localhost:8080/#/oauth/callback}
    auth-failure-url: ${FAILURE_REDIRECT_URL:http://localhost:8080/#/auth/error}
  jwt:
    access-expire-ms: ${ACCESS_EXPIRE_MS:1800000}      # 30분
    refresh-expire-ms: ${REFRESH_EXPIRE_MS:1209600000} # 14일
  cookie:
    secure: true
    same-site: Lax
    refresh-max-age: ${REFRESH_MAX_AGE:1209600}        # 14일(초)